<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rental Records · Minneapolis</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<meta name="description" content="Check a Minneapolis rental before applying: its license, its condition record, and any open city code violations.">
<style>
  /* Paper (light) */
  :root {
    --bg:#FAF8F4; --fg:#1F2328; --muted:#6B6A64; --line:#E2DED4; --card:#FFFFFF;
    --accent:#0F6E56; --bad:#A32D2D; --bad-bg:#FCEBEB; --ok:#0F6E56;
    --chip-bg:#E1F5EE; --chip-fg:#085041; --stat-bg:#F1EFE8;
  }
  /* Night (automatic dark mode) */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#14161A; --fg:#E8EAED; --muted:#9AA0A6; --line:#2E333A; --card:#1C1F24;
      --accent:#EF9F27; --bad:#F09595; --bad-bg:#3A1A1A; --ok:#5DCAA5;
      --chip-bg:#3A2A10; --chip-fg:#FAC775; --stat-bg:#23272D;
    }
  }

  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:960px; margin:0 auto; padding:28px 16px 48px; }

  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .top h1 { margin:0; font-size:28px; font-weight:600; letter-spacing:-0.01em; }
  .top h1 a { color:inherit; text-decoration:none; }
  .top .about-link { color:var(--muted); text-decoration:none; font-size:15px; }
  .top .about-link:hover { color:var(--fg); }
  .tagline { margin:8px 0 2px; }
  .muted { color:var(--muted); font-size:14px; }
  #view { margin-top:28px; }

  h2 { margin:4px 0 8px; font-weight:600; }
  h3 { font-weight:600; }
  input[type=search] { width:100%; padding:13px 14px; font-size:16px; border:1px solid var(--line); border-radius:10px;
                       background:var(--card); color:var(--fg); outline:none; }
  input[type=search]:focus { border-color:var(--accent); }
  a.link, .results a { color:var(--accent); text-decoration:none; }
  a.link:hover, .results a:hover { text-decoration:underline; }
  .results div { padding:10px 0; border-bottom:1px solid var(--line); }

  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:10px; margin:16px 0; }
  .stat { background:var(--stat-bg); border-radius:10px; padding:12px 14px; }
  .stat b { display:block; font-size:22px; font-weight:600; }
  .stat span { color:var(--muted); font-size:13px; }
  .stat.alert { background:var(--bad-bg); }
  .stat.alert b, .stat.alert span { color:var(--bad); }

  .table-wrap { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:last-child td { border-bottom:none; }
  th { color:var(--muted); font-weight:600; }
  .open { color:var(--bad); font-weight:600; }
  .good { color:var(--ok); }
  .note { font-size:13px; color:var(--muted); margin-top:10px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
  .chip { background:var(--chip-bg); color:var(--chip-fg); border-radius:999px; padding:4px 11px; font-size:13px; }

  .about { max-width:680px; }
  .about h3 { margin:28px 0 6px; font-size:17px; }
  .about ol, .about ul { padding-left:20px; }
  .about li { margin:6px 0; }

  footer { max-width:960px; margin:0 auto; padding:16px 16px 40px; border-top:1px solid var(--line);
           color:var(--muted); font-size:13px; display:flex; flex-wrap:wrap; gap:6px 16px; justify-content:space-between; }
  footer a { color:var(--muted); }
</style>
</head>
<body>
<main>
  <header class="top">
    <h1><a href="#">🏠 Rental Records</a></h1>
    <a class="about-link" href="#about">About</a>
  </header>
  <div class="tagline">Check a Minneapolis rental before applying: its license, its condition record, and any open city code violations.</div>
  <div class="muted" id="updated">Loading data…</div>
  <section id="view"></section>
</main>
<footer>
  <span>Public data from the City of Minneapolis. Not affiliated with the City or any housing authority.</span>
  <a href="#about">About this project</a>
</footer>

<script>
const state = { properties: [], ownersByKey: new Map(), shards: new Map(), query: "" };
const view = document.getElementById("view");

// Escape text from the data so names can never be read as HTML
const esc = (s) => String(s ?? "—").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (n, digits = 0) => n == null ? "—" :
  Number(n).toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });
const stat = (value, label, cls = "") => `<div class="stat ${cls}"><b>${value}</b><span>${label}</span></div>`;

// Retries a few times, because large downloads occasionally get cut off
async function loadJSON(path, attempts = 3) {
  for (let i = 1; ; i++) {
    try {
      const res = await fetch(path);
      if (!res.ok) throw new Error(`Could not load ${path} (${res.status})`);
      return await res.json();
    } catch (err) {
      if (i >= attempts) throw err;
      await new Promise((resolve) => setTimeout(resolve, 500 * i));
    }
  }
}

async function loadViolations(apn) {
  const key = apn.slice(-2);
  if (!state.shards.has(key)) {
    state.shards.set(key, await loadJSON(`data/violations/${encodeURIComponent(key)}.json`));
  }
  return state.shards.get(key)[apn] || [];
}

// Each page has its own link (#p=..., #o=..., #about), so the back button and shared links work
function route() {
  const hash = decodeURIComponent(location.hash.slice(1));
  const i = hash.indexOf("=");
  const kind = i === -1 ? hash : hash.slice(0, i);
  const value = i === -1 ? "" : hash.slice(i + 1);
  window.scrollTo(0, 0);
  if (kind === "p") return showProperty(value);
  if (kind === "o") return showOwner(value);
  if (kind === "about") return showAbout();
  return showSearch();
}

function showSearch() {
  view.innerHTML = `
    <input type="search" id="q" autocomplete="off"
           placeholder="Street address, e.g. 2400 Lyndale or Lake St" value="${esc(state.query)}">
    <div class="results" id="results"></div>`;
  const input = document.getElementById("q");
  input.addEventListener("input", () => { state.query = input.value; renderResults(); });
  input.focus();
  renderResults();
}

function renderResults() {
  const q = state.query.trim().toUpperCase();
  const box = document.getElementById("results");
  if (q.length < 3) {
    box.innerHTML = `<p class="muted">Type at least 3 characters. Short searches work best, like the house number and street name.</p>`;
    return;
  }
  const matches = state.properties.filter((p) => p.address && p.address.toUpperCase().includes(q)).slice(0, 50);
  if (!matches.length) {
    box.innerHTML = `<p class="muted">No licensed rentals match. Try fewer words, like "2400 Lyndale".</p>`;
    return;
  }
  box.innerHTML =
    `<p class="muted">${matches.length === 50 ? "First 50 matches" : `${matches.length} matches`}</p>` +
    matches.map((p) => `
      <div>
        <a href="#p=${encodeURIComponent(p.license_number)}">${esc(p.address)}</a>
        <span class="muted">· ${num(p.units)} units · ${num(p.violations_open)} open violations</span>
      </div>`).join("");
}

async function showProperty(license) {
  const p = state.properties.find((x) => x.license_number === license);
  if (!p) {
    view.innerHTML = `<p>Property not found. <a class="link" href="#">Back to search</a></p>`;
    return;
  }
  const owner = state.ownersByKey.get(p.owner_key);
  const nameLink = owner
    ? `<a class="link" href="#o=${encodeURIComponent(p.owner_key)}">${esc(p.owner_name)}</a>
       <span class="muted">(${num(owner.properties)} properties under this name)</span>`
    : esc(p.owner_name);

  view.innerHTML = `
    <p><a class="link" href="#">← Back to search</a></p>
    <h2>${esc(p.address)}</h2>
    <div class="stats">
      ${stat(num(p.violations_open), "Open violations", p.violations_open > 0 ? "alert" : "")}
      ${stat(esc(p.tier), "License tier")}
      ${stat(num(p.units), "Units")}
      ${stat(num(p.violations_2yr), "Violations, last 2 years")}
      ${stat(num(p.violations_2yr_per_unit, 2), "Per unit, last 2 years")}
    </div>
    <p>
      <b>Name on rental license:</b> ${nameLink}<br>
      <b>License:</b> ${esc(p.license_number)} · ${esc(p.status)} · expires ${esc(p.expiration_date)}<br>
      <b>Neighborhood:</b> ${esc(p.neighborhood)}
    </p>
    <h3>Code violations since 2016</h3>
    <div id="violations" class="muted">Loading…</div>
    <p class="note">Violations are recorded by parcel and may predate the current owner. Commercial fire inspections are not included.</p>`;

  try {
    renderViolations(p.apn ? await loadViolations(p.apn) : []);
  } catch (err) {
    const box = document.getElementById("violations");
    if (box) box.innerHTML = `<p class="open">Could not load violations. ${esc(err.message)}</p>`;
  }
}

function renderViolations(rows) {
  const box = document.getElementById("violations");
  if (!box) return; // the visitor already moved to another page
  box.className = "";
  if (!rows.length) {
    box.innerHTML = `<p class="good">No code violations on record for this parcel since 2016.</p>`;
    return;
  }
  const counts = {};
  rows.forEach((r) => { counts[r[1]] = (counts[r[1]] || 0) + 1; });
  box.innerHTML = `
    <div class="chips">
      ${Object.entries(counts).sort((a, b) => b[1] - a[1])
        .map(([category, n]) => `<span class="chip">${esc(category)}: ${num(n)}</span>`).join("")}
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Date</th><th>Category</th><th>Violation</th><th>Status</th><th>Resolved</th></tr></thead>
      <tbody>${rows.map((r) => `
        <tr>
          <td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td>
          <td>${r[4] ? esc(r[4]) : '<span class="open">Open</span>'}</td>
        </tr>`).join("")}
      </tbody>
    </table></div>`;
}

function showOwner(key) {
  const o = state.ownersByKey.get(key);
  if (!o) {
    view.innerHTML = `<p>Name not found. <a class="link" href="#">Back to search</a></p>`;
    return;
  }
  const props = state.properties
    .filter((p) => p.owner_key === key)
    .sort((a, b) => (b.violations_open || 0) - (a.violations_open || 0));

  view.innerHTML = `
    <p><a class="link" href="#">← Back to search</a></p>
    <div class="muted">Name on rental license</div>
    <h2>${esc(o.owner_name)}</h2>
    <div class="stats">
      ${stat(num(o.violations_open), "Open violations", o.violations_open > 0 ? "alert" : "")}
      ${stat(num(o.properties), "Properties")}
      ${stat(num(o.units), "Units")}
      ${stat(num(o.violations_2yr_per_unit, 2), "Violations per unit, last 2 years")}
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Address</th><th>Units</th><th>Tier</th><th>Open</th><th>Last 2 yrs</th><th>Per unit</th></tr></thead>
      <tbody>${props.map((p) => `
        <tr>
          <td><a class="link" href="#p=${encodeURIComponent(p.license_number)}">${esc(p.address)}</a></td>
          <td>${num(p.units)}</td><td>${esc(p.tier)}</td><td>${num(p.violations_open)}</td>
          <td>${num(p.violations_2yr)}</td><td>${num(p.violations_2yr_per_unit, 2)}</td>
        </tr>`).join("")}
      </tbody>
    </table></div>
    <p class="note">Properties are grouped by the name on the rental license, which is often a manager or contact
    person rather than the legal owner. One landlord may also use several names that are not yet grouped together.</p>`;
}

function showAbout() {
  view.innerHTML = `
    <div class="about">
      <p><a class="link" href="#">← Back to search</a></p>
      <h2>Why Rental Records exists</h2>

      <p>Finding a home is hard. For families searching with a Housing Choice Voucher (Section 8), it can be much
      harder. They are working against a deadline. The unit they choose has to pass an inspection before they can
      move in. And they are often deciding on a home after seeing it for only a few minutes, with no way of knowing
      how it has really been cared for.</p>

      <p>The information that could help them already exists. The City of Minneapolis inspects rental homes and
      records the problems it finds. But those records are spread across different city websites and written in
      language that is hard to follow, especially for someone navigating the housing system for the first time.</p>

      <p>Rental Records was built to close that gap. It brings a rental's public record together in one place and
      explains it in plain language, so that renters, and especially voucher holders, can understand a home before
      they apply. No one should have to spend an application fee, a long bus ride to a viewing, or precious days of
      a voucher search on a place with problems they had no way of seeing.</p>

      <h3>How it works</h3>
      <ol>
        <li><b>Searching an address</b> brings up the rental's license, its condition rating, and its record of
        city code violations.</li>
        <li><b>Open violations come first.</b> These are problems the city found that have not been fixed yet.
        Problems inside the home, like heat, plumbing, or pests, and fire safety issues, like missing smoke
        detectors, are the ones most worth asking a landlord about.</li>
        <li><b>The last two years tell the most.</b> A building with many recent problems for its size is one that
        deserves more questions.</li>
        <li><b>The name on the license</b> links to every other building listed under that name, showing how a
        landlord tends to care for their properties overall.</li>
      </ol>

      <h3>Reading the record fairly</h3>
      <ul>
        <li>Almost every building has some violations. Many come from routine city inspections and are minor.
        A problem that was fixed years ago is not a red flag.</li>
        <li>Large buildings naturally have more violations than small ones. Counting violations "per unit" keeps
        the comparison fair.</li>
        <li>Violations stay with the property, so some may date from before the current owner.</li>
      </ul>

      <h3>Renters' rights</h3>
      <p>In Minneapolis, city law generally does not allow landlords to turn renters away simply because they use a
      housing voucher. Renters with questions about their rights can contact <b>HOME Line</b>, which offers free,
      confidential advice to renters across Minnesota. No one has to navigate this alone.</p>

      <h3>Where the information comes from</h3>
      <p>Everything on Rental Records comes from the City of Minneapolis's public records: rental licenses and more
      than ten years of housing and fire inspection results, updated every week. The phone numbers and email
      addresses the city publishes for license holders are intentionally left out.</p>

      <p class="note">Rental Records is an independent project. It is not connected to the City of Minneapolis or
      any housing authority, and it is not legal advice. Public records can contain mistakes or be out of date.</p>
    </div>`;
}

async function init() {
  try {
    const [meta, properties, owners] = await Promise.all([
      loadJSON("data/meta.json"),
      loadJSON("data/properties.json"),
      loadJSON("data/owners.json"),
    ]);
    state.properties = properties;
    owners.forEach((o) => state.ownersByKey.set(o.owner_key, o));
    document.getElementById("updated").textContent =
      `City of Minneapolis data · last updated ${meta.last_updated}`;
    window.addEventListener("hashchange", route);
    route();
  } catch (err) {
    view.innerHTML = `<p class="open">Sorry, the data could not be loaded. ${esc(err.message)}</p>`;
  }
}

init();
</script>
</body>
</html>
